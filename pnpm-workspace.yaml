packages:
  - "apps/*"
  - "packages/*"
minimumReleaseAgeExclude:
  - viem@2.55.13
  - '@next/env@15.5.29'
  - '@next/swc-darwin-arm64@15.5.29'
  - '@next/swc-darwin-x64@15.5.29'
  - '@next/swc-linux-arm64-gnu@15.5.29'
  - '@next/swc-linux-arm64-musl@15.5.29'
  - '@next/swc-linux-x64-gnu@15.5.29'
  - '@next/swc-linux-x64-musl@15.5.29'
  - '@next/swc-win32-arm64-msvc@15.5.29'
  - '@next/swc-win32-x64-msvc@15.5.29'
  - '@privy-io/api-base@2.0.0'
  - '@privy-io/chains@0.7.0'
  - '@privy-io/ethereum@0.2.6'
  - '@privy-io/js-sdk-core@0.79.2'
  - '@privy-io/react-auth@3.51.1'
  - '@privy-io/routes@0.5.0'
  - next@15.5.29
# None of these dependency build scripts are needed to build or run the web
# app, so pnpm skips them on purpose. Explicit false entries satisfy pnpm 11's
# strict dependency-build policy without executing unnecessary install scripts.
allowBuilds:
  "@reown/appkit": false
  bufferutil: false
  es5-ext: false
  esbuild: false
  keccak: false
  sharp: false
  utf-8-validate: false

# Keep transitive runtime dependencies on versions that fix current advisories.
overrides:
  zod: 4.6.7
  "sharp@<0.35.5": 0.35.5
  "ws@8": ^8.21.0
  "postcss@8": ^8.5.23
  "axios@1": ^1.20.0
  "follow-redirects@1": ^1.16.2
  "source-map-js@1": ^1.2.2
  "fast-uri@3": ^3.1.9
  "fast-uri@4": ^4.2.3
  "js-yaml@4": ^4.3.2
  "brace-expansion@1": ^1.1.20
  "uuid@8": 11.1.1
  "uuid@9": 11.1.1
  decode-uri-component: 0.5.1
  # The published GenLayer runtime does not import its mistakenly shipped linter.
  "genlayer-js>eslint-plugin-import": "-"
  "fast-copy@3": ^3.1.0
  "fast-copy@4": ^4.1.0
  vite: ^7.3.7

patchedDependencies:
  decode-uri-component@0.5.1: patches/decode-uri-component@0.5.1.patch
