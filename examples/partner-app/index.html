<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partner social app · Roque swaps</title>
<style>body{font:17px system-ui;max-width:650px;margin:4rem auto;padding:1rem}input,button{font:inherit;padding:.7rem;margin:.4rem 0}input{width:90%}pre{white-space:pre-wrap;overflow-wrap:anywhere}button:disabled{opacity:.5}</style>
<h1>Partner social app</h1><p>Swap Sepolia test tokens using this app's wallet. The partner backend keeps its application key; your wallet signs each transaction.</p>
<button id="connect">Connect app wallet</button><label for="command">Tell the app what to swap</label><input id="command" value="Swap 10 rUSDC for rWETH"><button id="prepare" disabled>Prepare a trade</button><pre id="review"></pre><button id="sign" disabled>Reviewed: sign allowance and swap</button><button id="status" disabled>Refresh settlement</button><p id="message" role="status"></p>
<script type="module">
import{RoqueClient,SubmittedTradeError}from'/sdk.js';
import{createWalletClient,custom,formatUnits}from'/sdk.js';
const config=await(await fetch("/config.json")).json();const api=new RoqueClient(location.origin,{authOrigin:config.authOrigin}),el=id=>document.getElementById(id);let wallet,owner,plan,busy=false;
async function work(fn){if(busy)return;busy=true;try{await fn();}catch(e){el('message').textContent=e.message;}finally{busy=false;}}
el('connect').onclick=()=>work(async()=>{if(!window.ethereum)throw new Error('Open this app with an EVM wallet.');wallet=createWalletClient({transport:custom(window.ethereum)});[owner]=await wallet.requestAddresses();await wallet.switchChain({id:11155111});await api.connect(owner,message=>wallet.signMessage({account:owner,message}));el('prepare').disabled=false;el('message').textContent='Connected '+owner;});
el('prepare').onclick=()=>work(async()=>{plan=undefined;el('sign').disabled=true;el('message').textContent='Interpreting…';const intent=await api.createIntent(el('command').value,crypto.randomUUID());for(let i=0;i<150;i++){const result=await api.intent(intent.id);if(result.status==='ready')break;if(['failed','rejected'].includes(result.status))throw new Error('Provide an absolute immediate swap.');if(i===149)throw new Error('Interpretation is pending. Intent '+intent.id);await new Promise(r=>setTimeout(r,2000));}const quote=await api.quote(intent.id,crypto.randomUUID());plan=await api.prepare(quote.quoteId,crypto.randomUUID());el('review').textContent=`Spend ${formatUnits(BigInt(plan.amountInRaw),plan.tokenInDecimals)} ${plan.tokenInSymbol}\nMinimum receive ${formatUnits(BigInt(plan.minAmountOutRaw),plan.tokenOutDecimals)} ${plan.tokenOutSymbol}\nRecipient ${plan.recipient}\nSepolia · price impact ${plan.priceImpactBps/100}% · fee ${plan.feeBps/100}%\nExpires ${new Date(plan.expiresAt*1000).toLocaleString()}`;el('sign').disabled=false;el('message').textContent='Review every field before signing.';});
el('sign').onclick=()=>work(async()=>{el('sign').disabled=true;try{const hash=await api.executeReviewedPlan(plan,wallet,owner);el('message').textContent='Submitted '+hash;}catch(e){if(e instanceof SubmittedTradeError)el('message').textContent=e.message+' '+e.txHash;else throw e;}finally{el('status').disabled=false;}});
el('status').onclick=()=>work(async()=>{const result=await api.swap(plan.swapId);el('message').textContent=JSON.stringify({status:result.status,settlement:result.settlement});});
</script></html>
