[project]
name = "roque-genlayer"
version = "0.1.0"
description = "Roque intent interpreter, a GenLayer intelligent contract that reads plain English trades and rules on subjective conditions"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "genvm-linter==0.11.0; python_version >= '3.12'",
  "pytest==9.1.1",
  "ruff==0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# GenLayer intelligent contracts are meant to be written against a star import
# of the runtime SDK (`from genlayer import *`); the SDK provides gl, TreeMap,
# DynArray and friends this way. That is the documented idiom, so the star
# import warnings do not apply to contract modules.
"contracts/*.py" = ["F403", "F405"]
