name: Judgment loop

# The message a timed-out screen shows says the keeper picks the order up within
# a few minutes. On this deployment that was not true. Vercel's Hobby plan runs
# cron jobs once a day, so vercel.json schedules the judgment tick at 12:40 and
# nothing else screens an event order: the five-minute Action next to this one
# hits /api/cron/keeper, which walks OrderBook ids and never looks at an event
# order or a playbook. A screen that outlived its request therefore waited up to
# twenty-four hours for the fallback.
#
# So the fallback runs from here instead, on the same free minutes the keeper
# uses. Overlap is safe by construction rather than by scheduling: every row is
# claimed or leased before any work is bought, so a pass that meets another
# finds nothing to take.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Queued rather than cancelled. A pass part way through a consensus round has
# already paid for it, and killing it would throw that away; the next one simply
# waits its turn.
concurrency:
  group: judgment-loop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  judgment:
    name: Screen, adjudicate and advance
    runs-on: ubuntu-24.04
    # The route may run for up to 300s, so allow for one full pass plus the
    # handshake rather than cutting it off at the interval.
    timeout-minutes: 12
    steps:
      - name: Run the judgment tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent \
            --retry 2 --retry-all-errors --max-time 320 \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://roque-dex.vercel.app/api/cron/judgment

      - name: Recover public jobs and wallet settlements
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent \
            --retry 2 --retry-all-errors --max-time 320 \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://roque-dex.vercel.app/api/cron/public
