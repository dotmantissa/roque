packages:
  - "apps/*"
  - "packages/*"
minimumReleaseAgeExclude:
  - viem@2.55.13
# None of these dependency build scripts are needed to build or run the web
# app, so pnpm skips them on purpose. Explicit false entries satisfy pnpm 11's
# strict dependency-build policy without executing unnecessary install scripts.
allowBuilds:
  "@reown/appkit": false
  bufferutil: false
  es5-ext: false
  esbuild: false
  keccak: false
  sharp: false
  utf-8-validate: false
