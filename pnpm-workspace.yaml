packages:
  - "apps/*"
  - "packages/*"
minimumReleaseAgeExclude:
  - viem@2.55.13
# None of these dependency build scripts are needed to build or run the web
# app, so pnpm skips them on purpose. Listing them keeps CI installs quiet
# instead of failing on unapproved builds.
ignoredBuiltDependencies:
  - "@reown/appkit"
  - bufferutil
  - es5-ext
  - esbuild
  - keccak
  - sharp
  - utf-8-validate
allowBuilds:
  '@reown/appkit': true
  bufferutil: true
  es5-ext: true
  esbuild: true
  keccak: true
  sharp: true
  utf-8-validate: true
